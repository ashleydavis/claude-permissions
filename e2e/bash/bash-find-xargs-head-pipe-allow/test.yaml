description: "bash: find | xargs grep | head triple pipe all allow"

input:
  tool_name: Bash
  tool_input:
    command: "find ${PROJECT_DIR}/fixtures -name '*.yaml' | xargs grep -l 'git' 2>/dev/null | head -5"
  cwd: ${PROJECT_DIR}

rules:
  bash:
    find:
      cmd: "./**"
      decide: allow
    grep:
      decide: allow
    head:
      decide: allow

home_dir_files:
  commands/xargs.yaml:
    xargs:
      description: Build and run command lines from standard input
      wrapper: true
      positionals:
        - variadic: true

expected:
  decision: allow
