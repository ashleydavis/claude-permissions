description: "bash: xargs rm should be denied"

input:
  tool_name: Bash
  tool_input:
    command: "xargs rm -f"
  cwd: ${PROJECT_DIR}

rules: {}

home_dir_files:
  bash-rules.yaml:
    bash:
      rm:
        decide: deny

  commands/xargs.yaml:
    xargs:
      description: Build and run command lines from standard input
      wrapper: true
      positionals:
        - variadic: true

expected:
  decision: deny
