tool_call:
  tool_name: Bash
  tool_input:
    command: cmd > out.log 2>&1
ast:
  type: bash
  source: cmd > out.log 2>&1
  children:
    command:
      type: redirect
      source: cmd > out.log 2>&1
      children:
        left:
          type: redirect
          source: cmd > out.log
          children:
            left:
              type: command
              source: cmd > out.log 2>&1
              commandName: cmd
              options: {}
              positionals: []
              envPrefix: {}
            right:
              type: target
              source: out.log
              path: out.log
          op: ">"
        right:
          type: target
          source: "1"
          path: "1"
      op: 2>&
